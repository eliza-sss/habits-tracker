<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker & Analytics</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-container">

    <!-- Header Section -->
    <header class="app-header">
      <div class="brand">
        <span class="logo-icon">✨</span>
        <h1>Habit Tracker</h1>
      </div>
      <div id="auth-status" class="auth-status">
        <span id="user-email"></span>
        <button id="logout-btn" class="btn btn-secondary hidden">Sign Out</button>
      </div>
    </header>

    <!-- Authentication Form -->
    <section id="auth-section" class="card auth-card">
      <h2 id="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in or create an account to start tracking your habits.</p>
      
      <form id="auth-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        
        <div class="auth-buttons">
          <button type="submit" id="login-btn" class="btn btn-primary">Sign In</button>
          <button type="button" id="signup-btn" class="btn btn-outline">Sign Up</button>
        </div>
      </form>
      <div id="auth-message" class="message"></div>
    </section>

    <!-- Main Dashboard Section -->
    <main id="dashboard-section" class="hidden">
      
      <!-- Daily Progress Card -->
      <section class="card progress-card">
        <div class="progress-header">
          <div>
            <h2>Today's Progress</h2>
            <p id="progress-subtitle" class="progress-subtitle">0 of 0 habits completed</p>
          </div>
          <div id="progress-percent" class="progress-percent">0%</div>
        </div>
        <div class="progress-bar-container">
          <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </section>

      <!-- New Habit Form -->
      <section class="card new-habit-card">
        <h2>Create a New Habit</h2>
        <form id="add-habit-form" class="inline-form">
          <input type="text" id="habit-title" placeholder="e.g., Read 20 pages, Drink water..." required>
          <select id="habit-category">
            <option value="Health">💪 Health</option>
            <option value="Productivity">⚡ Productivity</option>
            <option value="Mindfulness">🧘 Mindfulness</option>
            <option value="General" selected>📌 General</option>
          </select>
          <button type="submit" class="btn btn-primary">+ Add Habit</button>
        </form>
      </section>

      <!-- Habits List -->
      <section class="habits-section">
        <h2>Your Habits</h2>
        <div id="habits-list" class="habits-grid">
          <!-- Habit items dynamically injected here -->
        </div>
      </section>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
